# Nginx reverse proxy — only for a VPS. Certificates: certbot --nginx -d sentravail.com -d www.sentravail.com
server {
  listen 80;
  server_name sentravail.com www.sentravail.com;
  return 301 https://sentravail.com$request_uri;
}

server {
  listen 443 ssl http2;
  server_name sentravail.com;

  # ssl_certificate / ssl_certificate_key are added by certbot

  client_max_body_size 8m;           # CV 5 MB, images 2 MB
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSockets (Socket.io notifications)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
