<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1668e3">
  <title>Hors connexion | SenTravail</title>
  <link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f2f5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #111827; padding: 24px; box-sizing: border-box; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.12); padding: 32px 24px; max-width: 380px; text-align: center; }
    .logo { font-size: 32px; font-weight: 800; color: #1668e3; letter-spacing: -1px; margin: 0 0 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #4b5563; line-height: 1.5; margin: 0 0 20px; }
    a { display: inline-block; background: #1668e3; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 20px; border-radius: 8px; }
  </style>
</head>
<body>
  <main class="card">
    <p class="logo">sentravail</p>
    <h1>Vous êtes hors connexion</h1>
    <p>Vérifiez votre connexion internet (données mobiles ou Wi-Fi), puis réessayez.</p>
    <a href="/">Réessayer</a>
  </main>
</body>
</html>
